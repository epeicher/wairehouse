name: Build /docs plans index

# Rebuilds docs/index.html whenever a plan is added/changed in docs/, so the
# index stays in sync no matter how files get there (git push or web upload).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build-docs-index.sh'
      - '.github/workflows/build-index.yml'

permissions:
  contents: write

concurrency:
  group: build-docs-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so per-file dates are accurate

      - name: Regenerate index
        run: bash build-docs-index.sh

      - name: Commit if the index changed
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Index already up to date."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "chore: rebuild /docs plans index [skip ci]"
            git push
          fi
